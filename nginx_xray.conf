server {
    server_name xray-business-bot.online www.xray-business-bot.online;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/xray-business-bot;
    }

    # OpenAPI 3.1 & DATA-API.yaml specifications and Swagger UI / Redoc
    location ~ ^/(docs|swagger|openapi\.yaml|DATA-API\.yaml) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints forwarded to local Gunicorn
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        gzip off;
    }

    # Django Admin forwarded to local Gunicorn
    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Django static files (admin styles, scripts, fonts)
    location /static/ {
        alias /opt/xray-business/xray-be/xray_be/static/;
        expires 30d;
        access_log off;
    }

    # Frontend SPA served from the deployed build
    location / {
        root /var/www/xray-business-bot;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xray-business-bot.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xray-business-bot.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.xray-business-bot.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = xray-business-bot.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name xray-business-bot.online www.xray-business-bot.online;
    return 404; # managed by Certbot
}
