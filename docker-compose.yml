version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xray-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xray_db}
      POSTGRES_USER: ${POSTGRES_USER:-xray_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xray_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xray_user} -d ${POSTGRES_DB:-xray_db}"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: xray-be/Dockerfile
    container_name: xray-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-xray-business-hackathon-2026}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,https://xray-business-bot.online,http://87.120.165.142,http://144.31.157.209,http://144.31.157.209:8000,http://144.31.157.209:5173}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-xray_db}
      POSTGRES_USER: ${POSTGRES_USER:-xray_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xray_secret_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://144.31.157.209:8317/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-TnEv9ZcsfpQN3n40amQjP377qkMOOndbkIyrOveacIUX6}
      OPENAI_MODEL: ${OPENAI_MODEL:-gemini-3.8-flash-high}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      CORS_ALLOW_ALL_ORIGINS: "true"
    volumes:
      - backend_static:/app/xray-be/xray_be/static
      - backend_data:/app/xray-be/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./xray-fe
      dockerfile: Dockerfile
    container_name: xray-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - backend_static:/var/www/static:ro
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5173:80"

volumes:
  postgres_data:
  backend_static:
  backend_data:
