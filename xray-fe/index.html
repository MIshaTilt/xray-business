<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Business X-Ray — Stream Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #333;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #64748b;
    }
    #output {
      margin-top: 20px;
      padding: 16px;
      min-height: 140px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.6;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background-color: #2563eb;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>AI Business X-Ray — Stream Demo</h1>
  <p>Пример работы потокового вывода через Server-Sent Events (SSE) с Django бэкенда.</p>

  <button id="sendBtn" onclick="sendRequest()">Hello world</button>
  <div id="status" class="status"></div>

  <div id="output">Нажмите кнопку, чтобы получить потоковый ответ...</div>

  <script>
    async function sendRequest() {
      const btn = document.getElementById('sendBtn');
      const status = document.getElementById('status');
      const output = document.getElementById('output');

      btn.disabled = true;
      status.textContent = 'Подключение к бэкенду...';
      output.textContent = '';

      // Создаем мигающий курсор
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      output.appendChild(cursor);

      try {
        const response = await fetch('http://127.0.0.1:8000/api/chat/stream/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ prompt: 'Hello world! Расскажи кратко в 2-3 предложениях, как работает бизнес-рентген.' })
        });

        if (!response.ok) {
          throw new Error(`Ошибка сервера: ${response.status}`);
        }

        status.textContent = 'Генерация ответа в реальном времени...';

        // Читаем ReadableStream чанками
        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // Оставляем незавершенную строку в буфере

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith('data:')) continue;

            const payloadStr = trimmed.replace(/^data:\s*/, '');
            if (payloadStr === '[DONE]') {
              break;
            }

            try {
              const data = JSON.parse(payloadStr);
              if (data.choices && data.choices[0] && data.choices[0].delta) {
                const chunk = data.choices[0].delta.content || '';
                if (chunk) {
                  // Вставляем текст перед курсором
                  cursor.insertAdjacentText('beforebegin', chunk);
                }
              } else if (data.error) {
                cursor.insertAdjacentText('beforebegin', '\n[Ошибка: ' + data.error + ']');
              }
            } catch (err) {
              console.error('Ошибка парсинга SSE чанка:', err, payloadStr);
            }
          }
        }

        status.textContent = 'Завершено!';
      } catch (err) {
        status.textContent = 'Ошибка: ' + err.message;
        cursor.insertAdjacentText('beforebegin', '\n[Ошибка соединения: ' + err.message + ']');
      } finally {
        cursor.remove();
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
