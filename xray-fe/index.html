<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-Ray</title>
    <script>
      window.addEventListener('error', (event) => {
        if (!/ResizeObserver loop/.test(event.message || '')) return
        event.preventDefault()
        event.stopImmediatePropagation()
      }, true)
      window.addEventListener('unhandledrejection', (event) => {
        const reason = event.reason
        const name = reason && reason.name
        const message = String((reason && (reason.message || reason)) || '')
        if (
          name === 'AbortError' ||
          name === 'InvalidStateError' ||
          /Transition was skipped|View transition|ResizeObserver loop/.test(message)
        ) {
          event.preventDefault()
          event.stopImmediatePropagation()
        }
      }, true)
    </script>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (!window.WebApp && window.Telegram && window.Telegram.WebApp) {
        window.WebApp = window.Telegram.WebApp
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
