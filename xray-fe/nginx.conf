server {
    listen 80;
    server_name localhost 13.143.163.133 144.31.157.209;

    client_max_body_size 50M;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Let's Encrypt ACME Challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect HTTP to HTTPS for the new IP 13.143.163.133
    if ($host = 13.143.163.133) {
        return 301 https://$host$request_uri;
    }

    # Static assets and SPA frontend routing (for HTTP on 144.31.157.209)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to Django REST backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Django Admin Panel
    location /admin {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Django static files (admin assets, Swagger UI bundles)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Automated check specifications (OpenAPI 3.1 & DATA-API.yaml)
    location = /openapi.yaml {
        proxy_pass http://backend:8000/openapi.yaml;
        proxy_set_header Host $http_host;
    }

    location = /DATA-API.yaml {
        proxy_pass http://backend:8000/DATA-API.yaml;
        proxy_set_header Host $http_host;
    }

    # Swagger UI documentation redirects
    location ~ ^/(docs|swagger) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }
}

server {
    listen 443 ssl;
    server_name 13.143.163.133 localhost;

    ssl_certificate /etc/letsencrypt/live/13.143.163.133/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.143.163.133/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

